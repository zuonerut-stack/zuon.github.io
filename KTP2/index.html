<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe6d8" />
  <title>KTP Library</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">KOREAN TOOLBOX PROJECT · V2</p>
        <h1>Korean Library</h1>
      </div>
      <button class="icon-btn" id="themeButton" aria-label="Theme information">◐</button>
    </header>

    <main>
      <section class="search-panel">
        <label for="globalSearch">Search the library</label>
        <div class="search-box">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Search words, topics, places, or expressions" autocomplete="off" />
          <button id="clearSearch" aria-label="Clear search">×</button>
        </div>
        <div id="searchMeta" class="search-meta">Browse folders or search across all content.</div>
      </section>

      <section class="library-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LIBRARY</p>
            <h2>Folders</h2>
          </div>
        </div>
        <div id="folderGrid" class="folder-grid"></div>
      </section>

      <section class="results-section" id="resultsSection">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CONTENT</p>
            <h2 id="resultsTitle">Recently added</h2>
          </div>
        </div>
        <div id="contentList" class="content-list"></div>
      </section>
    </main>

    <dialog id="contentDialog">
      <button class="dialog-close" id="dialogClose" aria-label="Close">×</button>
      <p class="eyebrow" id="dialogType">CONTENT</p>
      <h2 id="dialogTitle"></h2>
      <p class="dialog-subtitle" id="dialogSubtitle"></p>
      <div id="dialogBody" class="dialog-body"></div>
      <div class="dialog-actions">
        <button id="playAudio" class="secondary-btn">▶ Listen</button>
        <button id="saveItem" class="primary-btn">☆ Save</button>
      </div>
    </dialog>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
